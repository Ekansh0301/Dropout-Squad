data:
  max_eval_samples: 3098
  max_seq_length: 256
  max_train_samples: 26329
  test_path: data/splits/test
  train_path: data/splits/train
  val_path: data/splits/validation
hardware:
  device_map: 'null'
  use_cpu: false
lora:
  bias: none
  lora_alpha: 32
  lora_dropout: 0.05
  r: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - dense
  task_type: CAUSAL_LM
model:
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  load_in_4bit: true
  name: microsoft/phi-2
project:
  description: Fast training for semester project interim submission
  name: director-llm-interim
seed: 42
training:
  bf16: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  ddp_find_unused_parameters: false
  eval_steps: 1000
  eval_strategy: steps
  fp16: true
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0002
  load_best_model_at_end: true
  logging_first_step: true
  logging_steps: 25
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  metric_for_best_model: eval_loss
  num_train_epochs: 1
  optim: paged_adamw_8bit
  output_dir: models/sft_baseline_interim
  per_device_eval_batch_size: 1
  per_device_train_batch_size: 1
  report_to: wandb
  run_name: dm-sft-interim-10pct-1epoch
  save_steps: 1000
  save_strategy: steps
  save_total_limit: 2
  warmup_ratio: 0.03
  warmup_steps: 100
  weight_decay: 0.01
