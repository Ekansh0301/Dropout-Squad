# SFT Model Training Configuration for Director LLM

data:
  max_eval_samples: 3098
  max_seq_length: 256
  max_train_samples: 26329
  test_path: data/splits/test
  train_path: data/splits/train
  val_path: data/splits/validation

hardware:
  device_map: "null"
  use_cpu: false

# LoRA configuration
lora:
  bias: none
  lora_alpha: 32
  lora_dropout: 0.05
  r: 16
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - dense
  task_type: CAUSAL_LM

# Model and quantization
model:
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  load_in_4bit: true
  name: microsoft/phi-2

project:
  description: Fast training for semester project interim submission
  name: director-llm-interim
seed: 42

# Training parameters
training:
  # Memory optimization
  bf16: false
  fp16: true
  gradient_checkpointing: true

  # Multi-GPU data loading
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  ddp_find_unused_parameters: false

  # Batch configuration
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  # Training schedule
  num_train_epochs: 1
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: paged_adamw_8bit

  # Evaluation and checkpointing
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss

  # Logging
  logging_steps: 25
  logging_first_step: true
  report_to: wandb
  run_name: dm-sft-interim-10pct-1epoch

  # Output
  output_dir: models/sft_baseline_interim
