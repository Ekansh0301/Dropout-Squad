# ======================================================================================
# MASTER CONFIGURATION FOR PPO TRAINING
# ======================================================================================
# This file controls all aspects of the PPO fine-tuning pipeline.
# It is designed to be the single source of truth for a training run.
# ======================================================================================

project_name: "Director-LLM-MCRL"
run_name: "ppo-run-{date}" # A descriptive name for this specific run. {date} can be replaced by a script.

# ======================================================================================
# SECTION 1: FILE PATHS
# --------------------------------------------------------------------------------------
# All paths point to the final, trained models from the previous stages.
# Your main training script will load these artifacts.
# ======================================================================================
model_paths:
  # The SFT-tuned model which will be trained with PPO.
  policy_model_path: "models/director-sft-baseline"
  
  # The Narrative Critic (trained for regression).
  narrative_critic_path: "models/narrative_critic_finetuned"
  
  # The Causal Critic (fine-tuned for NLI classification).
  causal_critic_path: "models/causal_critic_finetuned"
  
  # The Hybrid Player's generator model (e.g., fine-tuned DistilGPT-2).
  player_generator_path: "models/player_generator"
  
  # The Hybrid Player's intent classifier (e.g., fine-tuned DistilBERT).
  player_classifier_path: "models/player_classifier"

# ======================================================================================
# SECTION 2: PPO HYPERPARAMETERS
# --------------------------------------------------------------------------------------
# These parameters are highly sensitive and control the stability and
# effectiveness of the PPO algorithm.
# ======================================================================================
ppo_hyperparameters:
  # The learning rate for the PPO optimizer. Must be very small for stable RL fine-tuning.
  learning_rate: 1.41e-6
  
  # The number of interactions (prompt-response pairs) to collect from the
  # model before performing a PPO update.
  batch_size: 32
  
  # The batch size used within the PPO update step. Must be <= batch_size.
  mini_batch_size: 8
  
  # Number of steps to accumulate gradients over. Set to 1 if VRAM allows.
  # Increase if you run out of memory during the update step.
  gradient_accumulation_steps: 1
  
  # Number of epochs to train on the collected batch of experiences.
  # A value of 4 is standard.
  ppo_epochs: 4
  
  # === KL Divergence Control (CRITICAL FOR STABILITY) ===
  # KL divergence measures how much the PPO model has "strayed" from the
  # original SFT model. This is used as a penalty to prevent the model
  # from forgetting its language capabilities (catastrophic forgetting).
  
  # If true, the KL coefficient will be dynamically adjusted to meet a target.
  adap_kl_ctrl: true
  
  # The initial coefficient for the KL penalty.
  init_kl_coef: 0.2
  
  # The target KL value. If the KL divergence goes above this, the penalty increases.
  target_kl: 6.0
  # === End of KL Control ===
  
  # Gamma (discount factor) for future rewards. 1.0 means no discount.
  gamma: 1.0
  
  # Lam (lambda) for Generalized Advantage Estimation (GAE). 0.95 is standard.
  lam: 0.95
  
  # The clipping range for the PPO policy objective. 0.2 is standard.
  cliprange: 0.2
  
  # Coefficient for the value function loss in the PPO update. 0.1 is standard.
  vf_coef: 0.1

# ======================================================================================
# SECTION 3: TRAINING & REWARD SETTINGS
# --------------------------------------------------------------------------------------
# General settings for the training run and reward function.
# ======================================================================================
training_settings:
  # The directory where the final PPO-trained model will be saved.
  output_dir: "models/director_ppo_final"
  
  # The total number of PPO steps (interactions) to run.
  # This is the primary control for the total training duration.
  total_ppo_steps: 1000
  
  # Random seed for reproducibility.
  seed: 42
  
  # Where to log metrics. Can be "wandb", "tensorboard", or "none".
  log_with: "wandb"

reward_weights:
  # How to combine the critic scores. These should sum to 1.0.
  # This is a key experimental parameter. A higher narrative weight
  # prioritizes style, while a higher causal weight prioritizes logic.
  narrative: 0.7
  causal: 0.3

# ======================================================================================
# SECTION 4: GENERATION SETTINGS
# --------------------------------------------------------------------------------------
# These parameters control how the model generates text during the
# "experience gathering" phase of the PPO loop.
# ======================================================================================
generation_settings:
  # Max length of the prompt generated by the Hybrid Player.
  max_prompt_length: 128
  
  # Max number of *new* tokens to generate for the DM's response.
  max_new_tokens: 128
  
  # Enables sampling-based decoding (more creative than greedy search).
  do_sample: true
  
  # Top-k sampling: considers only the k most likely tokens at each step.
  top_k: 50
  
  # Top-p (nucleus) sampling: considers the smallest set of tokens whose
  # cumulative probability exceeds p.
  top_p: 0.95