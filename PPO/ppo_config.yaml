# PPO Configuration for Director LLM Multi-Critic RL Training
# Controls PPOTrainingOrchestrator pipeline with dynamic reward weighting

project_name: "Director-LLM-MCRL"
run_name: "ppo-run-{date}"

# Model paths
model_paths:
  policy_model_path: "models/director-sft-baseline_interim"
  narrative_critic_path: "models/narrative_critic_finetuned"
  causal_critic_path: "models/causal_critic_finetuned"
  player_generator_path: "models/player_generator"
  player_classifier_path: "models/player_classifier"

# PPO hyperparameters
ppo_hyperparameters:
  learning_rate: 1.41e-6
  batch_size: 16 # Interactions to collect
  mini_batch_size: 4 # Update batch size
  gradient_accumulation_steps: 1
  ppo_epochs: 4

  # KL divergence control
  adap_kl_ctrl: true
  init_kl_coef: 0.2
  target_kl: 6.0

  # PPO parameters
  gamma: 1.0
  lam: 0.95
  cliprange: 0.2
  vf_coef: 0.1

# Training configuration
training_settings:
  output_dir: "models/director_ppo_final"
  total_ppo_steps: 1000
  seed: 42

  # Dynamic vs static reward weighting
  use_dynamic_weighting: true

  # Stability and logging
  max_reward_clip: 10.0 # Prevent extreme reward values
  log_with: "wandb"
  checkpoint_interval: 100
  eval_interval: 100

# Static reward weights (used when use_dynamic_weighting=false)
reward_weights:
  narrative: 0.7
  causal: 0.3

# Dynamic reward weights by player intent (used when use_dynamic_weighting=true)
dynamic_reward_weights:
  # Exploration: prioritize narrative quality
  EXPLORE:
    narrative: 0.8
    causal: 0.2

  # Actions: prioritize logical consistency
  ACTION:
    narrative: 0.3
    causal: 0.7

  # Dialogue: balance style and coherence
  DIALOGUE:
    narrative: 0.6
    causal: 0.4

  # Fallback for unclassified intents
  default:
    narrative: 0.5
    causal: 0.5

# Text generation parameters
generation_settings:
  max_prompt_length: 128
  max_new_tokens: 128
  do_sample: true
  top_k: 50
  top_p: 0.95
  temperature: 0.75
