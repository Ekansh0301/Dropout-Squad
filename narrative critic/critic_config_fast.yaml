# Narrative Critic Training Configuration - Multi-GPU Optimized
model:
  name: "microsoft/deberta-v3-base"
  num_labels: 1
  problem_type: "regression"

data:
  train_path: "data/rocstoriestrain.json"
  val_path: "data/rocstoriesval.json"
  max_seq_length: 128 # Reduced for 2x speed

training:
  output_dir: "models/narrative_critic"
  num_train_epochs: 20

  # Memory-optimized batch configuration
  per_device_train_batch_size: 8  # Reduced from 32
  per_device_eval_batch_size: 8   # Reduced from 32
  gradient_accumulation_steps: 4  # Increased to maintain effective batch size

  # Optimization parameters
  learning_rate: 3e-5
  lr_scheduler_type: "cosine"  
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Evaluation and checkpointing
  logging_steps: 200
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 1 # Keep only best checkpoint

  # Memory optimization
  fp16: true
  gradient_checkpointing: true  # Added to reduce memory usage
  dataloader_num_workers: 2     # Reduced from 4
  dataloader_pin_memory: true

  # Model selection
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

  report_to: "none"

seed: 42
