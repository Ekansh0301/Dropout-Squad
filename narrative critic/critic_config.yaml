# Narrative Critic Training - Multi-GPU Optimized
model:
  name: "microsoft/deberta-v3-base"
  num_labels: 1
  problem_type: "regression"

data:
  train_path: "critic_training/train"
  val_path: "critic_training/val"
  max_seq_length: 128  # REDUCED: 128 instead of 256 for 2x speed

training:
  output_dir: "models/narrative_critic"
  num_train_epochs: 3  # REDUCED: 2 instead of 3
  
  # Multi-GPU batch sizes
  per_device_train_batch_size: 32  # INCREASED: 32 instead of 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  
  # Optimization
  learning_rate: 3e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Less frequent saves for speed
  logging_steps: 200
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 1  # Only keep best
  
  # Memory/speed optimization
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  
  # Best model tracking
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  
  report_to: "none"

seed: 42